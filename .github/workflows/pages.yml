name: GitHub Pages

on:
  workflow_dispatch:
    inputs:
      deploy_to_pages:
        description: Enable only after Pages is enabled in repository settings and deployment is approved
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build static site at /ff-land-plan/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: ${{ inputs.deploy_to_pages }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
